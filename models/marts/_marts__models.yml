version: 2

models:
  - name: fct_orders
    description: "Order-level fact table containing aggregate financial metrics and order metadata."
    columns:
      - name: order_id
        description: "Primary key for orders."
        tests:
          - unique
          - not_null

      - name: customer_id
        description: "Foreign key pointing to dim_customers."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

  - name: dim_customers
    description: "Customer dimension table containing attributes and lifetime purchasing metrics."
    columns:
      - name: customer_id
        description: "Primary key for customers."
        tests:
          - unique
          - not_null