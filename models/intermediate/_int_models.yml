version: 2

models:
  - name: int_order_items
    description: "One record per order line item (order_id + line_number)."
    columns:
      - name: order_item_id
        description: "Primary key for this table."
        tests:
          - unique
          - not_null

  - name: int_order_items_summary
    description: "One record per order_id."
    columns:
      - name: order_id
        description: "Primary key for this table."
        tests:
          - unique
          - not_null

