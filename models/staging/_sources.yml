version: 2

sources:
  - name: tpch_sample
    database: SNOWFLAKE_SAMPLE_DATA
    schema: TPCH_SF1
    description: "Raw TPC-H sample dataset provided natively inside Snowflake."
    tables:
      - name: orders
        description: "Raw order master records."
        config:
          loaded_at_field: "o_orderdate::timestamp"
          freshness:
            warn_after: {count: 15000, period: day}
            error_after: {count: 25000, period: day}

      - name: lineitem
        description: "Raw line item details."
        config:
          loaded_at_field: "l_shipdate::timestamp"
          freshness:
            warn_after: {count: 15000, period: day}
            error_after: {count: 25000, period: day}

      - name: customer
        description: "Raw customer master data."
        config:
          freshness: ~

  - name: gold_layer
    database: analytics_prod
    schema: gold_gold
    description: "Gold layer"
    tables:
      - name: pipeline_audit_log
        description: "Stores the audit information on fact loads."